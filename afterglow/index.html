<!doctype html>
<html class="landing" lang="ar" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>المتميز | PS4 HOST 14.00</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="branding.css" />
  </head>
  <body>
    <!-- Keep original navigation and JavaScript IDs unchanged. -->
    <div id="brand"><b>المتميز | PS4 HOST 14.00</b></div>

    <div class="shell">
      <img class="meme" src="momtaz-logo-v2.jpg"
           alt="شعار المتميز لصيانة الهواتف والبلايستيشن" />

      <main class="panel" dir="rtl">
        <p class="lede">إصدارات PS4 المدعومة: 12.00 &ndash; 14.00</p>

        <form class="pick" id="pick">
          <label class="opt">
            <input type="radio" name="payload" value="hen" />
            <span>تشغيل PS4-HEN</span>
          </label>
          <label class="opt">
            <input type="radio" name="payload" value="goldhen" checked />
            <span>تشغيل GoldHEN</span>
          </label>

          <label class="opt opt-auto">
            <input type="checkbox" id="auto" />
            <span>التشغيل التلقائي</span>
          </label>

          <button class="btn" type="submit">بدء التشغيل</button>
          <p class="count" id="count"></p>
          <p class="count" id="cache" aria-live="polite"></p>
        </form>
      </main>
    </div>

    <p class="byline">by well0nez/m0zz</p>
    <script src="launch.js"></script>
  </body>
</html>
